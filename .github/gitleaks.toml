title = "Motion release credentials policy"
[extend]
useDefault = true

[[allowlists]]
description = "Existing public, write-only OpenMotion analytics identifier; not a management credential"
regexTarget = "secret"
regexes = ['''^phc_u5dHWkwdqN626opkbbjDKk7xNzxR2UsJbdQqx3DncbjU$''']

[[allowlists]]
description = "Owner-approved public OpenMotion Feishu invitation, limited to the product READMEs, the shared community link and its bundled Studio asset"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)(README\.md|README\.zh-CN\.md|docs/README\.(zh-CN|ja)\.md)$''', '''(^|/)studio/src/motion/CommunityLink\.tsx$''', '''(^|/)studio/build/editor-assets/[^/]+\.js$''']
regexTarget = "secret"
regexes = ['''^61fk3f18-8ec0-40e4-8b2c-13311f9b5825$''']
