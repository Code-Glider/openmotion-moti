name: Build macOS offline source handoff ZIP
on:
  push:
    branches:
      - handoff/rtl-macos-continuation
    paths:
      - .github/workflows/rtl-macos-bundle.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete Git ancestry without Git LFS payloads
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Fetch exact branch tips
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/fix/rtl-inspector-prop-echo-blur-commit:refs/remotes/origin/fix/rtl-inspector-prop-echo-blur-commit' \
            '+refs/heads/test/rtl-native-caption-exact-history-temporal-parity:refs/remotes/origin/test/rtl-native-caption-exact-history-temporal-parity' \
            '+refs/heads/feat/rtl-bidi-phase4-font-portability:refs/remotes/origin/feat/rtl-bidi-phase4-font-portability' \
            '+refs/heads/handoff/rtl-macos-continuation:refs/remotes/origin/handoff/rtl-macos-continuation'
      - name: Build one offline cloneable archive with all required refs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rtl-macos-bundle"
          root="$RUNNER_TEMP/rtl-macos-bundle"
          git bundle create "$root/openmotion-moti.bundle" --all
          git bundle verify "$root/openmotion-moti.bundle"
          git archive --format=tar HEAD docs/rtl-macos-handoff.md scripts/rtl-macos-preflight.sh | tar -xf - -C "$root"
          cat > "$root/README-FIRST.txt" <<'EOF'
          OpenMotion macOS RTL/BiDi offline source handoff.

          The openmotion-moti.bundle file contains a complete Git history
          plus the consolidated working branch, experimental PR #62 branch,
          handoff branch, Phase 4 and main refs. Optional Git LFS media
          payloads are deliberately omitted. No npm dependencies are bundled.

          On the Mac, from the directory containing this file:
            git clone openmotion-moti.bundle openmotion-moti
            cd openmotion-moti
            git branch -a
            git switch -c macos/rtl-working origin/fix/rtl-inspector-prop-echo-blur-commit
            git worktree add -b macos/rtl-pr62-review ../openmotion-rtl-pr62 origin/test/rtl-native-caption-exact-history-temporal-parity

          Read docs/rtl-macos-handoff.md for prerequisites and further steps.
          Never force-reset worktrees. Fetch the GitHub remote before pushing.
          EOF
          cat > "$root/refs.txt" <<EOF
          Created from: $(git rev-parse HEAD)
          Consolidated working: $(git rev-parse refs/remotes/origin/fix/rtl-inspector-prop-echo-blur-commit)
          PR62 experiment: $(git rev-parse refs/remotes/origin/test/rtl-native-caption-exact-history-temporal-parity)
          Phase4: $(git rev-parse refs/remotes/origin/feat/rtl-bidi-phase4-font-portability)
          Main: $(git rev-parse refs/remotes/origin/main)
          EOF
          (cd "$RUNNER_TEMP" && zip -q -r -0 rtl-macos-all-in-one.zip rtl-macos-bundle)
          sha256sum "$RUNNER_TEMP/rtl-macos-all-in-one.zip"
          du -h "$RUNNER_TEMP/rtl-macos-all-in-one.zip"
      - name: Upload single ZIP
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rtl-macos-all-in-one-source-handoff
          path: ${{ runner.temp }}/rtl-macos-all-in-one.zip
          if-no-files-found: error
          retention-days: 14
      - name: Record artifact location on handoff pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          printf -v message 'Offline Mac source handoff ZIP built successfully from workflow run %s. Artifact ID: %s. Download: %s. The ZIP includes a Git bundle and all required refs; Git LFS payloads and npm packages are excluded.' "$GITHUB_RUN_ID" "$ARTIFACT_ID" "$ARTIFACT_URL"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/63/comments" -f body="$message"
